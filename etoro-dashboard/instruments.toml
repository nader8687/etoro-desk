# ── Master portfolio risk manager (risk_manager.py) ──────────────────────────
# Default-ON with conservative caps.  These bite only when the FLEET concentrates
# risk; a small book trades exactly as before.  The gate can SHRINK a trade to fit
# headroom or BLOCK it; it never blocks an exit, and fails open on error.  Tune
# freely — values hot-reload on the next tick (no restart needed).
[risk]
enabled                    = true
max_concurrent_positions   = 12     # of all bots, how many may be live at once
max_gross_exposure_pct     = 60.0   # Σ open position $ ≤ this % of equity
max_portfolio_heat_pct     = 6.0    # Σ risk-to-stop $ across all positions ≤ % equity
max_cluster_gross_pct      = 45.0   # Σ position $ within one correlated cluster (e.g. crypto)
max_cluster_net_pct        = 25.0   # |long$ − short$| within a cluster ≤ % equity
max_same_dir_per_cluster   = 6      # max same-direction positions per cluster (anti-stacking)
max_positions_per_asset    = 4      # how many bots may hold the same asset at once
block_internal_hedge       = false  # don't open opposite a larger same-asset net position
daily_drawdown_halt_pct    = 5.0    # halt NEW entries if today's realised P&L ≤ −% of equity

