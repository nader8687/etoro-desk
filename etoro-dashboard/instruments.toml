# ── EtoroDesk multi-instrument config ────────────────────────────────────────
# One bot per (asset x strategy).  Rebuild after changes: docker compose up --build -d
# auto_trade defaults to TRUE — disable individual bots from the Bots tab if needed.
# Each bot holds its OWN position independently (the one-position-per-asset limit
# was removed), so you can run many strategies on the same asset at once.
#
# EXITS are configured per-strategy in exit_profiles.py (trailing for trend bots,
# hard take-profit for mean-reverting bots).  To override a single bot, add
# `trailing_stop_pct = ...` and/or `take_profit_pct = ...` to its section.
#
# DIVERSIFICATION NOTE: every bot below trades XRP or BTC — both crypto, highly
# correlated (~0.7-0.9).  The risk manager's cluster caps stop the fleet piling
# into one correlated bet, but TRUE diversification needs UNCORRELATED assets.
# To add one, copy a block and change `label`/`strategy` (leave instrument_id=0
# to auto-resolve from eToro).  Examples of lower-correlation additions:
#   label = "Gold  (GOLD)"      # commodity — different driver than crypto
#   label = "Apple  (AAPL)"     # equity — different regime/hours
#   label = "EUR/USD  (EURUSD)" # FX major — low crypto correlation
# Each new asset becomes its own correlated cluster in the risk manager, so the
# cluster caps then genuinely spread risk instead of re-counting crypto.
# ─────────────────────────────────────────────────────────────────────────────

